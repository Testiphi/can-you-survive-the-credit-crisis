name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要这三项权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本从 package.json 的 packageManager 字段读取，保证与本地一致。
        # 注意 pnpm-workspace.yaml 使用了 pnpm 10+ 的 allowBuilds 字段。

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # enablement: true 会尝试通过 API 自动启用 Pages（build type = workflow），
      # 这样首次部署不需要手工去 Settings 里点。若权限不足则回落到手动启用。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 引擎是发布的门槛：引擎测试或数据校验失败就不该上线
      - name: 引擎测试（零依赖，无需安装）
        run: node --test "packages/core/test/*.test.ts"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 事件卡数据集校验
        run: python tools/validate_events.py

      - name: 价格模型量级检查
        run: node packages/core/test/price-check.ts 8 1

      - name: 构建前端
        run: pnpm --filter @cyscc/web build
        env:
          # 资源路径前缀：项目页面部署在 /<仓库名>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
